on:
    push: 
        branches: 
            - main
            - master

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
        - name: checkout 
          uses: actions/checkout@v4

        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
               dotnet-version: '8.0.x'
        - name: Restore
          run: dotnet restore
          working-directory: ./BookStore
        - name: Build
          run: dotnet build --no-restore
          working-directory: ./BookStore
        - name: Test
          run: dotnet test --no-build
          working-directory: ./BookStore
